name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [agent_message, agent_toml, control_request, import, tree_ops]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: fuzz-${{ runner.os }}-
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz@0.13.2 --locked
      # what earlier runs found is kept, so each run starts where the last one stopped
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && 1800 || 120 }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          seeds=()
          [[ -d "fuzz/seeds/$TARGET" ]] && seeds=("seeds/$TARGET")
          cd fuzz
          cargo +nightly fuzz run "$TARGET" "corpus/$TARGET" "${seeds[@]}" -- \
            -max_total_time="$SECONDS_TO_RUN" -rss_limit_mb=4096
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
