name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # a slow package mirror should fail the step quickly, not stall the job
  APT_OPTIONS: -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # downloaded packages are cached so a slow mirror only costs the run that fills it
      - name: Restore downloaded packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-test-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-test-${{ runner.os }}-
      - name: Install FUSE and sshd for the end-to-end tests
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS -o Dir::Cache::archives="$HOME/apt-archives" \
            install -y --no-install-recommends fuse3 openssh-server
          sudo chown -R "$USER" ~/apt-archives
      - name: Keep downloaded packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-test-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Check dependencies for advisories, licenses and sources
        run: |
          command -v cargo-deny || cargo install cargo-deny --locked
          cargo deny check
      # pidvault refuses to unlock where any process could trace an unlocked shell
      - name: Restrict ptrace as Ubuntu does by default
        run: sudo sysctl -w kernel.yama.ptrace_scope=1
      - run: cargo test

  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Give the runner user access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm-runner.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # downloaded packages are cached so a slow mirror only costs the run that fills it
      - name: Restore downloaded packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-vm-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-vm-${{ runner.os }}-
      - name: Install QEMU and image tooling
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS -o Dir::Cache::archives="$HOME/apt-archives" \
            install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage gpgv ubuntu-cloudimage-keyring apt-utils lintian
          sudo chown -R "$USER" ~/apt-archives
      - name: Keep downloaded packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-vm-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deb
            target
          key: vm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pidvault-vm
          key: cloud-image-${{ hashFiles('tests/vm/run.sh') }}
      - name: Install cargo-deb
        run: command -v cargo-deb || cargo install cargo-deb --locked
      - name: Run the VM tests
        env:
          PIDVAULT_VM_KEEP: "1"
          TMPDIR: ${{ runner.temp }}
        run: rm -rf target/debian && tests/vm/run.sh
      # the tag is about uploads to Debian itself, which this package never makes
      - name: Check the package with lintian
        run: lintian --fail-on error,warning --suppress-tags initial-upload-closes-no-bugs target/debian/pidvault_*.deb
      - name: Keep the VM logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-logs
          path: |
            ${{ runner.temp }}/pidvault-vm.*/console.log
            ${{ runner.temp }}/pidvault-vm.*/results.clean.tap
