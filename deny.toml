[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "RSA signing in the agent is blinded (keys.rs); no fixed rsa release exists" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained, reached only through age's translations; no replacement upstream" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 is left for public-key operations; the agent signs ECDSA with p256/p384 0.14 (keys.rs)" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
