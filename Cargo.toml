[package]
name = "sshvault"
version = "0.2.0"
edition = "2024"
description = "Per-shell access to an encrypted SSH configuration directory"
license = "MIT OR Apache-2.0"
authors = ["Torstein Tauno Svendsen <torstei@gmail.com>"]
repository = "https://github.com/torstei/sshvault"

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
fuser = { version = "0.18.0", default-features = false }
getrandom = "0.4.3"
libc = "0.2.191"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "sha256", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "sha384", "std"] }
rpassword = "7.5.4"
rsa = { version = "0.9", default-features = false, features = ["sha2", "getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
signature = "3"
ssh-encoding = { version = "0.3", features = ["base64"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "p256", "p384", "std", "encryption"] }
tar = "0.4.46"
toml = "1.1.8"
zeroize = { version = "1.9.1", features = ["serde"] }

[dev-dependencies]
clap_mangen = "0.3.3"
tempfile = "3.27.0"

[package.metadata.deb]
extended-description = """\
A shell that has run `sshvault unlock`, and every process it starts, sees the \
decrypted SSH config under /run/sshvault/<vault> and can use its keys through \
the vault agent, which never hands them out. Every other process of the same \
user sees nothing."""
changelog = "packaging/changelog.Debian"
section = "net"
copyright = "2026 Torstein Tauno Svendsen <torstei@gmail.com>"
depends = "$auto"
assets = [
    ["target/release/sshvault", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/sshvault/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/sshvault/changelog", "644"],
    ["packaging/sshvault.1", "usr/share/man/man1/sshvault.1", "644"],
]
maintainer-scripts = "packaging"
systemd-units = [
    { unit-scripts = "packaging", enable = true, start = true },
    { unit-scripts = "packaging", unit-name = "sshvault-mount", enable = true, start = true },
]
